[package]
name = "nono-connect"
# Experimental: not published, not part of the release train.
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Experimental portable (incl. Windows) client for attaching a local terminal to a hosted nono session"

[[bin]]
name = "nono-connect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
ureq = { version = "~3.5", features = ["platform-verifier"] }
url.workspace = true
urlencoding = "2"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "signal", "user"] }
tokio = { version = "1", features = ["signal"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
